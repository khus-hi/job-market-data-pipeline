name: job_market
version: "1.0.0"
config-version: 2
profile: job_market

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # How many days back an incremental run re-processes, to catch late or re-run days.
  lookback_days: 3

models:
  job_market:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  job_market:
    +schema: seeds
    skill_catalog:
      +column_types:
        skill_name: varchar
        category: varchar
        pattern: varchar
        case_sensitive: boolean
